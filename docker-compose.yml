services:
  mysql:
    image: mysql:8.4
    container_name: pro2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: pro2-redis
    ports: ["6379:6379"]

volumes:
  mysql-data:
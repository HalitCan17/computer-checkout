<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <style>
        body { font-family: sans-serif; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 4px 6px; }
        form { margin: 12px 0; }
        .msg { color: #b00020; margin-left: 8px; }
        .hidden { display: none; }
        .editing { margin-right: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>RESERVATIONS</h1>
    <p><a th:href="@{/students}">Students</a> | <a th:href="@{/computers}">Computers</a> | <a th:href="@{/chat}">Chat</a></p>

    <form id="addForm">
        <span id="editInfo" class="editing hidden"></span>
        <input id="studentNumber" class="addOnly" placeholder="Student number" required>
        <input id="reservationDate" type="datetime-local" required>
        <input id="returnDate" type="datetime-local" required>
        <select id="computerId" class="addOnly" required>
            <option value="">-- computer --</option>
            <option th:each="c : ${computers}" th:value="${c.id}" th:data-available="${c.available}"
                    th:data-label="${c.brand + ' ' + c.model + ' (' + c.serialNumber + ')'}"
                    th:text="${c.brand + ' ' + c.model + ' (' + c.serialNumber + ')'}"></option>
        </select>
        <button id="submitBtn" type="submit">Add</button>
        <button id="cancelBtn" type="button" class="hidden" onclick="cancelEdit()">Cancel</button>
        <span id="msg" class="msg"></span>
    </form>

    <table>
        <tr>
            <th>PHOTO</th>
            <th>STUDENT</th>
            <th>NUMBER</th>
            <th>DEPARTMENT</th>
            <th>COMPUTER</th>
            <th>SERIAL</th>
            <th>RESERVED</th>
            <th>RETURN</th>
            <th></th>
        </tr>
        <tr th:each="r : ${reservations}" th:data-computer="${r.computerId}"
            th:data-start="${#temporals.format(r.reservationDate, 'yyyy-MM-dd''T''HH:mm')}"
            th:data-end="${#temporals.format(r.returnDate, 'yyyy-MM-dd''T''HH:mm')}">
            <td>
                <img th:if="${r.photo != null}" style="width:1.5cm;" th:src="${'http://localhost:9870/webhdfs/v1/user/hadoop/images/' + r.photo + '?op=OPEN'}">
                <span th:unless="${r.photo != null}">-</span>
            </td>
            <td th:text="${r.firstName + ' ' + r.lastName}"></td>
            <td th:text="${r.studentNumber}"></td>
            <td th:text="${r.department}"></td>
            <td th:text="${r.brand + ' ' + r.model}"></td>
            <td th:text="${r.serialNumber}"></td>
            <td th:text="${#temporals.format(r.reservationDate, 'dd-MM-yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(r.returnDate, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                <button type="button"
                        th:data-id="${r.id}"
                        th:data-info="${r.firstName + ' ' + r.lastName + ' - ' + r.brand + ' ' + r.model}"
                        th:data-start="${#temporals.format(r.reservationDate, 'yyyy-MM-dd''T''HH:mm')}"
                        th:data-end="${#temporals.format(r.returnDate, 'yyyy-MM-dd''T''HH:mm')}"
                        onclick="editReservation(this)">Edit</button>
                <button type="button" th:onclick="'removeReservation(' + ${r.id} + ')'">Delete</button>
            </td>
        </tr>
    </table>

    <script>
        const msg = document.getElementById('msg');
        const editInfo = document.getElementById('editInfo');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        let editingId = null;   // null: yeni ekleme, dolu: bu id guncelleniyor

        function editReservation(btn) {
            editingId = btn.dataset.id;
            msg.textContent = '';
            editInfo.textContent = 'Editing #' + editingId + ': ' + btn.dataset.info;
            editInfo.classList.remove('hidden');
            document.querySelectorAll('.addOnly').forEach(e => e.classList.add('hidden'));
            document.getElementById('studentNumber').required = false;
            document.getElementById('computerId').required = false;
            document.getElementById('reservationDate').value = btn.dataset.start;
            document.getElementById('returnDate').value = btn.dataset.end;
            submitBtn.textContent = 'Save';
            cancelBtn.classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function cancelEdit() {
            location.reload();
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.textContent = '';
            const start = document.getElementById('reservationDate').value;
            const end = document.getElementById('returnDate').value;
            let res;
            if (editingId === null) {
                res = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentNumber: document.getElementById('studentNumber').value,
                        computerId: Number(document.getElementById('computerId').value),
                        reservationDate: start,
                        returnDate: end
                    })
                });
            } else {
                res = await fetch('/api/reservations/' + editingId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reservationDate: start, returnDate: end })
                });
            }
            if (res.ok) {
                location.reload();
            } else {
                msg.textContent = await res.text();
            }
        });

        // Tarih secilince dolu bilgisayarlari kirmizi yap ve secilemez kil
        const startIn = document.getElementById('reservationDate');
        const endIn = document.getElementById('returnDate');
        const compSel = document.getElementById('computerId');
        const busy = [...document.querySelectorAll('tr[data-computer]')]
            .map(tr => ({ c: tr.dataset.computer, s: tr.dataset.start, e: tr.dataset.end }));

        function refreshComputers() {
            const s = startIn.value, e = endIn.value;
            const ok = s && e && e > s;
            compSel.disabled = !ok;
            for (const o of compSel.options) {
                if (!o.value) { o.text = ok ? '-- computer --' : '-- pick dates first --'; continue; }
                const clash = ok && busy.find(b => b.c === o.value && b.s < e && b.e > s);
                const off = o.dataset.available === 'false';
                o.disabled = off || !!clash;
                o.style.color = clash ? '#b00020' : off ? '#888' : '';
                o.text = o.dataset.label + (off ? ' (not available)'
                        : clash ? ' (busy ' + clash.s.slice(5).replace('T', ' ') + ' - ' + clash.e.slice(11) + ')' : '');
            }
            if (compSel.selectedOptions[0] && compSel.selectedOptions[0].disabled) compSel.value = '';
        }
        startIn.addEventListener('input', refreshComputers);
        endIn.addEventListener('input', refreshComputers);
        refreshComputers();

        async function removeReservation(id) {
            if (!confirm('Delete reservation ' + id + '?')) return;
            const res = await fetch('/api/reservations/' + id, { method: 'DELETE' });
            if (res.ok) {
                location.reload();
            } else {
                msg.textContent = 'Delete failed (' + res.status + ')';
            }
        }
    </script>
</body>
</html>

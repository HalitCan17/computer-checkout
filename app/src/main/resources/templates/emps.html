<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 4px 6px; }
        .photo-msg { color: #b00020; font-size: 12px; }
    </style>
</head>
<body>
    <h1>EMPLOYEE</h1>
    <p><a th:href="@{/chat}">Chat</a></p>
    <table>
        <tr>
            <th>EMPNO</th>
            <th>ENAME</th>
            <th>JOB</th>
            <th>MGR</th>
            <th>HIREDATE</th>
            <th>SAL</th>
            <th>COMM</th>
            <th>DEPT</th>
            <th>IMG</th>
            <th>CHANGE PHOTO</th>
        </tr>
        <tr th:each="p : ${emps}">
            <td th:text="${p.empno}"></td>
            <td th:text="${p.ename}"></td>
            <td th:text="${p.job}"></td>
            <td th:text="${p.managerName}"></td>
            <td th:text="${#temporals.format(p.hireDate, 'dd-MM-yyyy')}"></td>
            <td th:text="${p.sal}"></td>
            <td th:text="${p.comm}"></td>
            <td th:text="${p.dname}"></td>
            <td><img style="width:1.5cm;" th:src="${'http://localhost:9870/webhdfs/v1/user/hadoop/images/' + p.img + '?op=OPEN'}"></td>
            <td>
                <input type="file" class="photo-file" accept="image/jpeg,image/png">
                <button type="button" class="photo-btn" th:attr="data-empno=${p.empno}">Upload</button>
                <div class="photo-msg"></div>
            </td>
        </tr>
    </table>

    <script>
        document.querySelectorAll('.photo-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var cell = btn.closest('td');
                var input = cell.querySelector('.photo-file');
                var msg = cell.querySelector('.photo-msg');
                var empno = btn.getAttribute('data-empno');

                if (!input.files.length) {
                    msg.textContent = 'Önce bir dosya seçin';
                    return;
                }

                if (input.files[0].size > 2 * 1024 * 1024) {
                    msg.textContent = 'Dosya çok büyük (en fazla 2 MB)';
                    return;
                }

                var form = new FormData();
                form.append('file', input.files[0]);

                btn.disabled = true;
                msg.textContent = 'yükleniyor...';

                fetch('/api/emps/' + empno + '/photo', { method: 'POST', body: form })
                    .then(function (res) {
                        if (res.ok) {
                            location.reload();
                            return;
                        }
                        return res.text().then(function (text) {
                            msg.textContent = text || ('Hata: ' + res.status);
                            btn.disabled = false;
                        });
                    })
                    .catch(function () {
                        msg.textContent = 'Bağlantı hatası';
                        btn.disabled = false;
                    });
            });
        });
    </script>
</body>
</html>
